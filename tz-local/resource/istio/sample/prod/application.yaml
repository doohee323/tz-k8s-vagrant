kubectl -n istio-system apply -f - <<EOF
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mc20-mc20-dev-ssl
  namespace: istio-system
spec:
  secretName: mc20-mc20-dev-ssl
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-istio
  commonName: test1.mc20-dev.eks-main-s.argear.io
  dnsNames:
    - test1.mc20-dev.eks-main-s.argear.io
    - develop.mc20-dev.eks-main-s.argear.io
---
EOF
