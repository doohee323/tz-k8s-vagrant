---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mc20-mc20-account-configmap
data:
  GIT_BRANCH: argo-vault
  DB_HOSTNAME: host.docker.internal
  DB_R_HOSTNAME: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: mc20-mc20-account-sv
spec:
  type: ClusterIP
  selector:
    app: mc20-mc20-account
  ports:
    - port: 80
      name: http-80
      targetPort: 8085
