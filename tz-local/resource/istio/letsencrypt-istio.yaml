apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-istio
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@drillquiz.com
    privateKeySecretRef:
      name: letsencrypt-istio
    solvers:
    - selector: {}
      http01:
        ingress:
          class: istio

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingress-cert-istio
spec:
  secretName: ingress-cert-istio
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-istio
  commonName: drillquiz.com
  dnsNames:
    - drillquiz.com
    - '*.drillquiz.com'

---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: istio
spec:
  controller: istio.io/ingress-controller
---
