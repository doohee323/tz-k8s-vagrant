apiVersion: v1
kind: Secret
metadata:
  name: aws-route53-secret-access-key-secret2
data:
  secret-access-key: minio_secret_access_key_base64

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-istio
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@seerslab.com
    privateKeySecretRef:
      name: letsencrypt-istio
    solvers:
    - selector: {}
      http01:
        ingress:
          class: istio

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ingress-cert-istio
spec:
  secretName: ingress-cert-istio
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-istio
  commonName: the-dive.io
  dnsNames:
    - api.the-dive.io
    - the-dive.io
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: istio
spec:
  controller: istio.io/ingress-controller
---
